version: '3.8'

services:
  db:
    image: mysql:8.0
    container_name: sistema_db
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: root123
      MYSQL_DATABASE: sistema_ventas_db
    ports:
      - "3306:3306"
    volumes:
      - db_data:/var/lib/mysql

  backend:
    build:
      context: ./backend
    container_name: sistema_backend
    restart: always
    ports:
      - "3000:3000"
    environment:
      - DATABASE_URL=mysql://root:root123@db:3306/sistema_ventas_db
      - PORT=3000
    depends_on:
      - db

  frontend:
    build:
      context: ./frontend
    container_name: sistema_frontend
    restart: always
    ports:
      - "80:80"
    depends_on:
      - backend

volumes:
  db_data:
